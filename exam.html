<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AZ-104 Timed Exam — Azure Administrator</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* ── Exam Layout ──────────────────────────────────────────────────────── */
    body { overflow-x: hidden; }

    .exam-layout {
      display: grid;
      grid-template-columns: 1fr 280px;
      grid-template-rows: auto 1fr;
      min-height: calc(100vh - 64px);
      max-width: 1400px;
      margin: 0 auto;
      gap: 0;
    }

    /* Case study panel — spans full width above content */
    .case-study-panel {
      grid-column: 1 / -1;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 0;
      max-height: 280px;
      overflow-y: auto;
    }
    .case-study-panel .cs-header {
      padding: 0.75rem 1.5rem 0;
      background: linear-gradient(135deg, rgba(0,120,212,0.1), transparent);
      border-bottom: 1px solid var(--border-color);
    }
    .case-study-panel .cs-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin: 0;
      padding-bottom: 0.75rem;
    }
    .cs-tabs {
      display: flex;
      gap: 0;
      padding: 0 1.5rem;
      border-bottom: 1px solid var(--border-color);
    }
    .cs-tab-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 0.82rem;
      padding: 0.6rem 1rem;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      font-weight: 500;
      transition: color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .cs-tab-btn:hover { color: var(--text-primary); }
    .cs-tab-btn.active { color: var(--azure-blue); border-bottom-color: var(--azure-blue); }
    .cs-tab-content { display: none; padding: 1rem 1.5rem; }
    .cs-tab-content.active { display: block; }
    .cs-content {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 0.82rem;
      line-height: 1.6;
      color: var(--text-secondary);
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .cs-image-wrap { padding: 0.75rem 1.5rem; }
    .cs-image { max-width: 100%; max-height: 160px; border-radius: 6px; }

    /* Main question area */
    .question-main {
      grid-column: 1;
      padding: 1.5rem;
      overflow-y: auto;
    }

    /* Sidebar */
    .exam-sidebar {
      grid-column: 2;
      grid-row: 2;
      background: var(--bg-card);
      border-left: 1px solid var(--border-color);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      overflow-y: auto;
    }

    /* Timer */
    .timer-widget {
      text-align: center;
      padding: 0.75rem;
      background: var(--bg-primary);
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }
    .timer-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
    #timer {
      display: block;
      font-size: 2rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
      letter-spacing: 0.05em;
      transition: color 0.3s;
    }
    #timer.timer-warning { color: var(--warning); }
    #timer.timer-critical { color: var(--error); animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }

    /* Progress */
    .progress-widget { }
    .progress-header {
      display: flex; justify-content: space-between;
      font-size: 0.78rem; color: var(--text-secondary);
      margin-bottom: 0.4rem;
    }
    .progress-bar {
      height: 6px;
      background: var(--bg-primary);
      border-radius: 99px;
      overflow: hidden;
    }
    #progress-fill {
      height: 100%;
      background: var(--azure-blue);
      border-radius: 99px;
      transition: width 0.3s;
    }

    /* Nav panel */
    .nav-widget {}
    .nav-widget-title { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.5rem; }
    #nav-panel {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }
    .nav-btn {
      width: 100%; aspect-ratio: 1;
      border-radius: 5px;
      border: 1px solid var(--border-color);
      background: var(--bg-primary);
      color: var(--text-secondary);
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .nav-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
    .nav-btn.nav-current { background: var(--azure-blue); color: #fff; border-color: var(--azure-blue); }
    .nav-btn.nav-answered { background: rgba(63,185,80,0.15); color: var(--success); border-color: var(--success); }
    .nav-btn.nav-flagged { background: rgba(210,153,34,0.15); color: var(--warning); border-color: var(--warning); }

    /* Nav legend */
    .nav-legend {
      display: flex; flex-direction: column; gap: 0.35rem;
      font-size: 0.72rem; color: var(--text-secondary);
    }
    .legend-item { display: flex; align-items: center; gap: 0.4rem; }
    .legend-dot {
      width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0;
    }
    .ld-current { background: var(--azure-blue); }
    .ld-answered { background: var(--success); }
    .ld-flagged { background: var(--warning); }
    .ld-unanswered { background: var(--bg-primary); border: 1px solid var(--border-color); }

    /* Submit button */
    .btn-submit-exam {
      width: 100%;
      padding: 0.75rem;
      background: var(--azure-blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit-exam:hover { background: #106ebe; }

    /* Question card */
    .question-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      max-width: 820px;
    }
    .question-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
      font-size: 0.78rem;
    }
    .q-counter { font-weight: 700; color: var(--text-primary); }
    .q-domain {
      padding: 0.2rem 0.6rem;
      border-radius: 99px;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .q-domain.d1 { background: rgba(0,120,212,0.15); color: var(--d1-color); }
    .q-domain.d2 { background: rgba(0,180,216,0.15); color: var(--d2-color); }
    .q-domain.d3 { background: rgba(131,56,236,0.15); color: var(--d3-color); }
    .q-domain.d4 { background: rgba(6,214,160,0.15); color: var(--d4-color); }
    .q-domain.d5 { background: rgba(247,127,0,0.15); color: var(--d5-color); }
    .q-type {
      background: var(--bg-primary);
      color: var(--text-secondary);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.7rem;
    }
    .q-subdomain { color: var(--text-muted); font-size: 0.72rem; }
    .flag-btn {
      margin-left: auto;
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      border-radius: 6px;
      padding: 0.2rem 0.6rem;
      font-size: 0.75rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .flag-btn:hover { background: var(--bg-hover); }
    .flag-btn.flagged { color: var(--warning); border-color: var(--warning); background: rgba(210,153,34,0.1); }

    .scenario-box {
      background: rgba(0,120,212,0.08);
      border-left: 3px solid var(--azure-blue);
      padding: 0.75rem 1rem;
      border-radius: 0 6px 6px 0;
      margin-bottom: 1rem;
      font-size: 0.88rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .question-text {
      font-size: 1rem;
      line-height: 1.7;
      color: var(--text-primary);
      margin: 0 0 1.25rem;
      font-weight: 500;
    }

    .multi-hint {
      font-size: 0.78rem;
      color: var(--azure-blue);
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .options-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.85rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      font-size: 0.9rem;
    }
    .option-item:hover { background: var(--bg-hover); border-color: var(--azure-blue); }
    .option-item input { display: none; }
    .option-item:has(input:checked) {
      background: rgba(0,120,212,0.12);
      border-color: var(--azure-blue);
    }
    .option-letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px; height: 24px;
      border-radius: 50%;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      font-weight: 700;
      font-size: 0.78rem;
      flex-shrink: 0;
      color: var(--text-secondary);
    }
    .option-item:has(input:checked) .option-letter {
      background: var(--azure-blue);
      border-color: var(--azure-blue);
      color: #fff;
    }
    .option-text { color: var(--text-primary); line-height: 1.5; }

    /* Answer marking */
    .option-item.correct { background: rgba(63,185,80,0.12); border-color: var(--success); }
    .option-item.correct .option-letter { background: var(--success); border-color: var(--success); color: #fff; }
    .option-item.incorrect { background: rgba(248,81,73,0.12); border-color: var(--error); }
    .option-item.incorrect .option-letter { background: var(--error); border-color: var(--error); color: #fff; }
    .option-item.missed { background: rgba(63,185,80,0.06); border-color: var(--success); border-style: dashed; }

    /* Explanation box */
    .explanation-box {
      margin-top: 1.25rem;
      background: #0d1117;
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--azure-blue);
      border-radius: 8px;
      padding: 1.1rem 1.25rem;
      font-size: 0.9rem;
      line-height: 1.75;
    }
    .exp-correct-row {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      background: rgba(63,185,80,0.1);
      border: 1px solid rgba(63,185,80,0.3);
      border-radius: 6px;
      padding: 0.65rem 0.85rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      color: #e6edf3;
    }
    .exp-check { color: var(--success); font-size: 1rem; flex-shrink: 0; margin-top: 1px; }
    .exp-correct-row strong { color: var(--success); }
    .exp-body {
      color: #c9d1d9;
      line-height: 1.75;
      font-size: 0.9rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .exp-reference {
      margin-top: 0.85rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border-color);
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .exp-reference a { color: var(--azure-blue); text-decoration: underline; }
    .dd-answer {
      font-family: 'Consolas', monospace;
      font-size: 0.82rem;
      margin: 0.5rem 0 0;
      color: var(--text-primary);
    }

    /* Drag & Drop */
    .dragdrop-wrapper {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .panel-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin: 0 0 0.5rem;
    }
    .drag-source { display: flex; flex-direction: column; gap: 0.4rem; }
    .drag-item {
      padding: 0.6rem 0.85rem;
      background: var(--bg-hover);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: grab;
      transition: background 0.15s, box-shadow 0.15s;
      user-select: none;
    }
    .drag-item:hover { background: rgba(0,120,212,0.1); border-color: var(--azure-blue); }
    .drag-item.dragging { opacity: 0.4; box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
    .drop-zone {
      margin-bottom: 0.5rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
    }
    .dz-label {
      display: block;
      font-size: 0.8rem;
      padding: 0.5rem 0.75rem;
      background: var(--bg-primary);
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border-color);
    }
    .dz-slot {
      min-height: 38px;
      padding: 0.4rem 0.75rem;
      color: var(--text-muted);
      font-size: 0.82rem;
      transition: background 0.15s;
    }
    .drop-zone.drag-over .dz-slot { background: rgba(0,120,212,0.1); }
    .placed-item {
      padding: 0.4rem 0.6rem;
      background: rgba(0,120,212,0.15);
      border-radius: 4px;
      font-size: 0.85rem;
      color: var(--azure-blue);
      font-weight: 600;
    }
    .placed-item.dd-correct { background: rgba(63,185,80,0.15); color: var(--success); }
    .placed-item.dd-incorrect { background: rgba(248,81,73,0.15); color: var(--error); }
    .dz-correct { border-color: var(--success); }
    .dz-incorrect { border-color: var(--error); }

    /* Question image */
    .question-image {
      margin-bottom: 1rem;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    .question-image img { width: 100%; display: block; }

    /* Bottom nav */
    .question-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      background: var(--bg-card);
      border-top: 1px solid var(--border-color);
      position: sticky;
      bottom: 0;
    }
    .btn-nav {
      padding: 0.6rem 1.25rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-nav-prev {
      background: var(--bg-hover);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
    }
    .btn-nav-prev:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-nav-next {
      background: var(--azure-blue);
      color: #fff;
      border: none;
    }
    .btn-nav-next:hover { background: #106ebe; }
    .btn-nav-next:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Score report */
    #score-report { display: none; max-width: 700px; margin: 2rem auto; padding: 1.5rem; }
    .score-report { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 2rem; }
    .score-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
    .score-title { font-size: 1.5rem; font-weight: 800; margin: 0; }
    .score-circle {
      width: 100px; height: 100px;
      border-radius: 50%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      border: 4px solid;
    }
    .grade-pass { border-color: var(--success); background: rgba(63,185,80,0.1); }
    .grade-fail { border-color: var(--error); background: rgba(248,81,73,0.1); }
    .score-pct { font-size: 1.4rem; font-weight: 800; line-height: 1; }
    .grade-pass .score-pct { color: var(--success); }
    .grade-fail .score-pct { color: var(--error); }
    .score-grade { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; margin-top: 2px; }
    .grade-pass .score-grade { color: var(--success); }
    .grade-fail .score-grade { color: var(--error); }
    .score-summary { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
    .stat-box {
      flex: 1; min-width: 80px;
      background: var(--bg-primary);
      border-radius: 10px;
      padding: 1rem;
      text-align: center;
    }
    .stat-num { display: block; font-size: 1.8rem; font-weight: 800; }
    .stat-num.success { color: var(--success); }
    .stat-num.error { color: var(--error); }
    .stat-num.warning { color: var(--warning); }
    .stat-lbl { font-size: 0.75rem; color: var(--text-secondary); }
    .domain-breakdown h3 { font-size: 0.9rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 1rem; }
    .domain-score-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.6rem; }
    .ds-name { font-size: 0.78rem; font-weight: 600; width: 200px; flex-shrink: 0; }
    .ds-name.d1 { color: var(--d1-color); }
    .ds-name.d2 { color: var(--d2-color); }
    .ds-name.d3 { color: var(--d3-color); }
    .ds-name.d4 { color: var(--d4-color); }
    .ds-name.d5 { color: var(--d5-color); }
    .ds-bar-wrap { flex: 1; height: 8px; background: var(--bg-primary); border-radius: 99px; overflow: hidden; }
    .ds-bar { height: 100%; border-radius: 99px; transition: width 0.6s; }
    .bar-pass { background: var(--success); }
    .bar-fail { background: var(--error); }
    .ds-pct { font-size: 0.75rem; color: var(--text-secondary); width: 90px; text-align: right; flex-shrink: 0; }
    .score-actions { display: flex; gap: 0.75rem; margin-top: 2rem; flex-wrap: wrap; }
    .btn-primary {
      background: var(--azure-blue); color: #fff;
      border: none; padding: 0.65rem 1.25rem;
      border-radius: 7px; font-weight: 700;
      font-size: 0.88rem; cursor: pointer;
    }
    .btn-primary:hover { background: #106ebe; }
    .btn-secondary {
      background: var(--bg-hover); color: var(--text-primary);
      border: 1px solid var(--border-color);
      padding: 0.65rem 1.25rem;
      border-radius: 7px; font-weight: 600;
      font-size: 0.88rem; cursor: pointer;
    }

    /* Setup screen */
    .setup-screen {
      max-width: 560px;
      margin: 4rem auto;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 2.5rem;
    }
    .setup-screen h2 { font-size: 1.5rem; font-weight: 800; margin: 0 0 0.5rem; }
    .setup-screen p { color: var(--text-secondary); margin: 0 0 2rem; }
    .setup-options { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1.5rem; }
    .setup-option {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem 1rem;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .setup-option:hover { border-color: var(--azure-blue); background: var(--bg-hover); }
    .setup-option.selected { border-color: var(--azure-blue); background: rgba(0,120,212,0.08); }
    .setup-option input { display: none; }
    .setup-option-name { font-weight: 600; font-size: 0.95rem; }
    .setup-option-desc { font-size: 0.8rem; color: var(--text-secondary); }
    .btn-start-exam {
      width: 100%;
      padding: 0.9rem;
      background: var(--azure-blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-start-exam:hover { background: #106ebe; }

    /* Responsive */
    @media (max-width: 768px) {
      .exam-layout { grid-template-columns: 1fr; }
      .case-study-panel { grid-column: 1; }
      .exam-sidebar { display: none; }
      .dragdrop-wrapper { grid-template-columns: 1fr; }
    }

    .empty-state { color: var(--text-muted); padding: 3rem; text-align: center; }
  </style>
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <div class="header-brand">
      <a href="index.html" style="text-decoration:none;display:flex;align-items:center;gap:0.5rem">
        <div class="brand-logo">AZ</div>
        <span class="brand-name">AZ-104 Simulator</span>
      </a>
    </div>
    <nav class="header-nav">
      <a href="index.html" class="nav-link">Dashboard</a>
      <a href="exam.html" class="nav-link active">Timed Exam</a>
      <a href="study.html" class="nav-link">Study Mode</a>
    </nav>
  </div>
</header>

<!-- ── Setup Screen ──────────────────────────────────────────────────────── -->
<div id="setup-screen" class="setup-screen">
  <h2>Configure Your Exam</h2>
  <p>Choose a domain focus or take a full mixed-domain exam.</p>

  <div class="setup-options" id="setup-options">
    <label class="setup-option selected" onclick="selectDomain(this, 0)">
      <input type="radio" name="domain" value="0" checked>
      <div>
        <div class="setup-option-name">Full Exam — All Domains</div>
        <div class="setup-option-desc">Mix of all 5 domains · 60 questions · 100 minutes</div>
      </div>
    </label>
    <label class="setup-option" onclick="selectDomain(this, 1)">
      <input type="radio" name="domain" value="1">
      <div>
        <div class="setup-option-name">Domain 1 — Identities &amp; Governance</div>
        <div class="setup-option-desc">Entra ID, RBAC, Policy, PIM · 20–25% of exam</div>
      </div>
    </label>
    <label class="setup-option" onclick="selectDomain(this, 2)">
      <input type="radio" name="domain" value="2">
      <div>
        <div class="setup-option-name">Domain 2 — Storage</div>
        <div class="setup-option-desc">Storage accounts, SAS, blobs, Files, lifecycle · 15–20%</div>
      </div>
    </label>
    <label class="setup-option" onclick="selectDomain(this, 3)">
      <input type="radio" name="domain" value="3">
      <div>
        <div class="setup-option-name">Domain 3 — Compute</div>
        <div class="setup-option-desc">VMs, ARM, containers, App Service · 20–25%</div>
      </div>
    </label>
    <label class="setup-option" onclick="selectDomain(this, 4)">
      <input type="radio" name="domain" value="4">
      <div>
        <div class="setup-option-name">Domain 4 — Virtual Networking</div>
        <div class="setup-option-desc">VNets, NSGs, VPN, DNS, Load Balancer · 15–20%</div>
      </div>
    </label>
    <label class="setup-option" onclick="selectDomain(this, 5)">
      <input type="radio" name="domain" value="5">
      <div>
        <div class="setup-option-name">Domain 5 — Monitor &amp; Maintain</div>
        <div class="setup-option-desc">Monitor, Backup, Site Recovery · 10–15%</div>
      </div>
    </label>
  </div>

  <button class="btn-start-exam" onclick="startExam()">Start Exam ▶</button>
</div>

<!-- ── Exam Container ────────────────────────────────────────────────────── -->
<div id="exam-container" style="display:none">
  <div class="exam-layout">
    <!-- Case study panel (hidden when no case study) -->
    <div class="case-study-panel" id="case-study-panel" style="display:none"></div>

    <!-- Question area -->
    <div class="question-main" id="question-area"></div>

    <!-- Sidebar -->
    <aside class="exam-sidebar">
      <div class="timer-widget">
        <span class="timer-label">Time Remaining</span>
        <span id="timer">1:40:00</span>
      </div>

      <div class="progress-widget">
        <div class="progress-header">
          <span>Progress</span>
          <span id="progress-label">0 / 0 answered</span>
        </div>
        <div class="progress-bar"><div id="progress-fill" style="width:0%"></div></div>
      </div>

      <div class="nav-widget">
        <div class="nav-widget-title">Question Navigator</div>
        <div id="nav-panel"></div>
      </div>

      <div class="nav-legend">
        <div class="legend-item"><span class="legend-dot ld-current"></span> Current</div>
        <div class="legend-item"><span class="legend-dot ld-answered"></span> Answered</div>
        <div class="legend-item"><span class="legend-dot ld-flagged"></span> Flagged</div>
        <div class="legend-item"><span class="legend-dot ld-unanswered"></span> Unanswered</div>
      </div>

      <button class="btn-submit-exam" onclick="Engine.submit(false)">Submit Exam</button>
    </aside>
  </div>

  <!-- Bottom navigation -->
  <div class="question-nav">
    <button class="btn-nav btn-nav-prev" id="btn-prev" onclick="Engine.prev()" disabled>← Previous</button>
    <span id="q-position" style="color:var(--text-secondary);font-size:0.85rem"></span>
    <button class="btn-nav btn-nav-next" id="btn-next" onclick="Engine.next()">Next →</button>
  </div>
</div>

<!-- Score report -->
<div id="score-report"></div>

<!-- Load question data -->
<script src="data/domain1.js"></script>
<script src="data/domain2.js"></script>
<script src="data/domain3.js"></script>
<script src="data/domain4.js"></script>
<script src="data/domain5.js"></script>
<script src="data/case_studies.js"></script>
<script src="js/engine.js"></script>
<script>
  let selectedDomain = 0;

  // Check URL params for pre-selection
  (function() {
    const p = new URLSearchParams(window.location.search);
    const d = parseInt(p.get('domain') || '0');
    if (!isNaN(d) && d >= 0 && d <= 5) {
      selectedDomain = d;
      if (d > 0) {
        // Auto-start if domain param given
        startExam();
      }
    }
  })();

  function selectDomain(label, domain) {
    document.querySelectorAll('.setup-option').forEach(o => o.classList.remove('selected'));
    label.classList.add('selected');
    selectedDomain = domain;
  }

  function startExam() {
    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('exam-container').style.display = '';

    const domainQuestionCounts = { 0: 60, 1: 25, 2: 20, 3: 25, 4: 25, 5: 20 };
    const minutes = selectedDomain === 0 ? 100 : 45;

    Engine.init({
      mode: 'exam',
      domain: selectedDomain,
      minutes: minutes
    });

    // Patch position display
    const origRender = Engine.getState;
    setInterval(() => {
      const s = Engine.getState();
      const el = document.getElementById('q-position');
      if (el && s.questions.length > 0) {
        el.textContent = `${s.currentIndex + 1} / ${s.questions.length}`;
      }
    }, 200);
  }
</script>

</body>
</html>
