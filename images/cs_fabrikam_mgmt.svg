<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" style="background:#1c2128;border-radius:8px;font-family:Segoe UI,sans-serif">
  <text x="350" y="22" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="600">Fabrikam — Management Group Hierarchy</text>

  <!-- Root MG -->
  <rect x="270" y="35" width="160" height="34" rx="6" fill="#21262d" stroke="#0078d4" stroke-width="2"/>
  <text x="350" y="51" text-anchor="middle" fill="#0078d4" font-size="9.5" font-weight="700">Root Management Group</text>
  <text x="350" y="62" text-anchor="middle" fill="#6e7681" font-size="8">Tenant Root</text>

  <!-- Fabrikam Parent MG -->
  <line x1="350" y1="69" x2="350" y2="90" stroke="#30363d" stroke-width="1.5"/>
  <rect x="255" y="90" width="190" height="30" rx="6" fill="#21262d" stroke="#8338ec" stroke-width="1.5"/>
  <text x="350" y="107" text-anchor="middle" fill="#8338ec" font-size="9" font-weight="700">Fabrikam-MG (Parent)</text>

  <!-- Corp-IT-MG -->
  <line x1="350" y1="120" x2="140" y2="145" stroke="#30363d" stroke-width="1"/>
  <rect x="40" y="145" width="200" height="30" rx="6" fill="#21262d" stroke="#0078d4" stroke-width="1.5"/>
  <text x="140" y="162" text-anchor="middle" fill="#0078d4" font-size="9" font-weight="700">Corp-IT-MG</text>

  <!-- Corp-IT Subscriptions -->
  <line x1="90" y1="175" x2="70" y2="198" stroke="#30363d" stroke-width="1"/>
  <rect x="15" y="198" width="110" height="28" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="70" y="213" text-anchor="middle" fill="#e6edf3" font-size="8.5">Production-Sub</text>
  <line x1="140" y1="175" x2="160" y2="198" stroke="#30363d" stroke-width="1"/>
  <rect x="110" y="198" width="100" height="28" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="160" y="213" text-anchor="middle" fill="#e6edf3" font-size="8.5">Staging-Sub</text>

  <!-- FabUS-MG -->
  <line x1="350" y1="120" x2="280" y2="145" stroke="#30363d" stroke-width="1"/>
  <rect x="210" y="145" width="140" height="30" rx="6" fill="#21262d" stroke="#00b4d8" stroke-width="1.5"/>
  <text x="280" y="162" text-anchor="middle" fill="#00b4d8" font-size="9" font-weight="700">FabrikamUS-MG</text>
  <line x1="280" y1="175" x2="280" y2="198" stroke="#30363d" stroke-width="1"/>
  <rect x="230" y="198" width="100" height="28" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="280" y="213" text-anchor="middle" fill="#e6edf3" font-size="8.5">FabUS-Sub</text>

  <!-- FabEU-MG -->
  <line x1="350" y1="120" x2="420" y2="145" stroke="#30363d" stroke-width="1"/>
  <rect x="350" y="145" width="140" height="30" rx="6" fill="#21262d" stroke="#06d6a0" stroke-width="1.5"/>
  <text x="420" y="162" text-anchor="middle" fill="#06d6a0" font-size="9" font-weight="700">FabrikamEU-MG</text>
  <line x1="420" y1="175" x2="420" y2="198" stroke="#30363d" stroke-width="1"/>
  <rect x="370" y="198" width="100" height="28" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="420" y="213" text-anchor="middle" fill="#e6edf3" font-size="8.5">FabEU-Sub</text>
  <!-- EU policy badge -->
  <rect x="370" y="230" width="100" height="18" rx="3" fill="rgba(6,214,160,0.1)" stroke="#06d6a0" stroke-width="1"/>
  <text x="420" y="242" text-anchor="middle" fill="#06d6a0" font-size="7">EU Regions Only Policy</text>

  <!-- FabAPAC-MG -->
  <line x1="350" y1="120" x2="570" y2="145" stroke="#30363d" stroke-width="1"/>
  <rect x="500" y="145" width="150" height="30" rx="6" fill="#21262d" stroke="#f77f00" stroke-width="1.5"/>
  <text x="575" y="162" text-anchor="middle" fill="#f77f00" font-size="9" font-weight="700">FabrikamAPAC-MG</text>
  <line x1="575" y1="175" x2="575" y2="198" stroke="#30363d" stroke-width="1"/>
  <rect x="525" y="198" width="100" height="28" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="575" y="213" text-anchor="middle" fill="#e6edf3" font-size="8.5">FabAPAC-Sub</text>

  <!-- Policy inheritance arrows -->
  <text x="350" y="265" text-anchor="middle" fill="#6e7681" font-size="8">Policies assigned at parent MG scope are inherited by all child subscriptions</text>

  <!-- Policy badges on Fabrikam-MG -->
  <rect x="255" y="124" width="90" height="14" rx="3" fill="rgba(131,56,236,0.15)" stroke="#8338ec" stroke-width="0.8"/>
  <text x="300" y="134" text-anchor="middle" fill="#8338ec" font-size="7">Tag Policy Initiative</text>

  <!-- Corp-IT policy badge -->
  <rect x="40" y="179" width="90" height="14" rx="3" fill="rgba(0,120,212,0.15)" stroke="#0078d4" stroke-width="0.8"/>
  <text x="85" y="189" text-anchor="middle" fill="#0078d4" font-size="7">Allowed Locations</text>

  <!-- PIM badge -->
  <rect x="155" y="179" width="90" height="14" rx="3" fill="rgba(248,81,73,0.12)" stroke="#f85149" stroke-width="0.8"/>
  <text x="200" y="189" text-anchor="middle" fill="#f85149" font-size="7">PIM — Owner Review</text>

  <!-- Legend -->
  <rect x="20" y="275" width="340" height="54" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="30" y="291" fill="#6e7681" font-size="8" font-weight="700">GOVERNANCE CONTROLS</text>
  <rect x="30" y="298" width="10" height="10" rx="2" fill="rgba(131,56,236,0.3)" stroke="#8338ec"/>
  <text x="44" y="307" fill="#8b949e" font-size="7.5">Tag Policy (Fabrikam-MG)</text>
  <rect x="145" y="298" width="10" height="10" rx="2" fill="rgba(6,214,160,0.2)" stroke="#06d6a0"/>
  <text x="159" y="307" fill="#8b949e" font-size="7.5">Location Restriction (EU-MG)</text>
  <rect x="280" y="298" width="10" height="10" rx="2" fill="rgba(248,81,73,0.2)" stroke="#f85149"/>
  <text x="294" y="307" fill="#8b949e" font-size="7.5">PIM (Corp-IT-MG)</text>
  <text x="30" y="322" fill="#6e7681" font-size="7.5">Policies are inherited: child MGs and subscriptions inherit all parent MG policies</text>
</svg>
