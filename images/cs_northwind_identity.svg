<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Arial, sans-serif">
  <!-- Background -->
  <rect width="900" height="560" fill="#0f1117" rx="12"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="#e2e8f0">Northwind Traders — Hybrid Identity Architecture</text>

  <!-- ===== ON-PREMISES ZONE ===== -->
  <rect x="20" y="55" width="260" height="340" rx="10" fill="none" stroke="#4a6fa5" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="150" y="75" text-anchor="middle" font-size="11" fill="#4a6fa5" font-weight="bold">On-Premises</text>

  <!-- On-prem DC -->
  <rect x="55" y="90" width="160" height="60" rx="8" fill="#1a2340" stroke="#4a6fa5" stroke-width="1"/>
  <text x="135" y="114" text-anchor="middle" font-size="11" fill="#a0c4ff">Active Directory DS</text>
  <text x="135" y="131" text-anchor="middle" font-size="10" fill="#7090b0">corp.northwindtraders.com</text>

  <!-- Users on-prem -->
  <circle cx="75" cy="205" r="22" fill="#1a2340" stroke="#4a6fa5" stroke-width="1"/>
  <text x="75" y="209" text-anchor="middle" font-size="10" fill="#a0c4ff">Users</text>
  <text x="75" y="240" text-anchor="middle" font-size="9" fill="#7090b0">15,000</text>

  <circle cx="155" cy="205" r="22" fill="#1a2340" stroke="#4a6fa5" stroke-width="1"/>
  <text x="155" y="209" text-anchor="middle" font-size="10" fill="#a0c4ff">Groups</text>
  <text x="155" y="240" text-anchor="middle" font-size="9" fill="#7090b0">480</text>

  <circle cx="235" cy="205" r="22" fill="#1a2340" stroke="#4a6fa5" stroke-width="1"/>
  <text x="235" y="209" text-anchor="middle" font-size="10" fill="#a0c4ff">Devices</text>
  <text x="235" y="240" text-anchor="middle" font-size="9" fill="#7090b0">8,200</text>

  <!-- AD Connect Server -->
  <rect x="60" y="270" width="170" height="50" rx="8" fill="#1e2d1e" stroke="#3db46d" stroke-width="1.5"/>
  <text x="145" y="291" text-anchor="middle" font-size="11" fill="#3db46d" font-weight="bold">Azure AD Connect</text>
  <text x="145" y="308" text-anchor="middle" font-size="9" fill="#5da87d">Password Hash Sync (PHS)</text>

  <!-- AD Connect arrows to cloud -->
  <line x1="230" y1="295" x2="330" y2="230" stroke="#3db46d" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <!-- On-prem DC to AD Connect -->
  <line x1="135" y1="150" x2="145" y2="270" stroke="#4a6fa5" stroke-width="1" marker-end="url(#arrow-blue)"/>

  <!-- ===== AZURE CLOUD ZONE ===== -->
  <rect x="310" y="55" width="560" height="460" rx="10" fill="none" stroke="#0078d4" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="590" y="75" text-anchor="middle" font-size="11" fill="#0078d4" font-weight="bold">Microsoft Azure</text>

  <!-- Microsoft Entra ID -->
  <rect x="340" y="90" width="200" height="80" rx="8" fill="#0c1a30" stroke="#0078d4" stroke-width="1.5"/>
  <text x="440" y="118" text-anchor="middle" font-size="12" fill="#4fc3f7" font-weight="bold">Microsoft Entra ID</text>
  <text x="440" y="136" text-anchor="middle" font-size="10" fill="#0078d4">northwindtraders.com (primary)</text>
  <text x="440" y="152" text-anchor="middle" font-size="9" fill="#5090a0">Hybrid Joined | PHS enabled</text>

  <!-- Entra to AD Connect arrow left -->
  <line x1="340" y1="140" x2="232" y2="295" stroke="#3db46d" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>

  <!-- PIM Box -->
  <rect x="570" y="90" width="170" height="80" rx="8" fill="#1a0c30" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="655" y="118" text-anchor="middle" font-size="12" fill="#a78bfa" font-weight="bold">Privileged Identity</text>
  <text x="655" y="134" text-anchor="middle" font-size="12" fill="#a78bfa" font-weight="bold">Management (PIM)</text>
  <text x="655" y="153" text-anchor="middle" font-size="9" fill="#7060b0">JIT activation · Approval workflows</text>

  <!-- Conditional Access -->
  <rect x="340" y="200" width="200" height="70" rx="8" fill="#1a1a0c" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="440" y="225" text-anchor="middle" font-size="12" fill="#fbbf24" font-weight="bold">Conditional Access</text>
  <text x="440" y="243" text-anchor="middle" font-size="9" fill="#a08010">MFA for all admins</text>
  <text x="440" y="257" text-anchor="middle" font-size="9" fill="#a08010">Block legacy auth · Compliant devices</text>

  <!-- Administrative Units -->
  <rect x="570" y="200" width="170" height="70" rx="8" fill="#0c1a0c" stroke="#22c55e" stroke-width="1.5"/>
  <text x="655" y="225" text-anchor="middle" font-size="12" fill="#4ade80" font-weight="bold">Administrative</text>
  <text x="655" y="241" text-anchor="middle" font-size="12" fill="#4ade80" font-weight="bold">Units</text>
  <text x="655" y="257" text-anchor="middle" font-size="9" fill="#30a050">Finance · IT · Sales · HR</text>

  <!-- Managed Identities -->
  <rect x="340" y="300" width="200" height="70" rx="8" fill="#1a0c1a" stroke="#ec4899" stroke-width="1.5"/>
  <text x="440" y="325" text-anchor="middle" font-size="12" fill="#f472b6" font-weight="bold">Managed Identities</text>
  <text x="440" y="343" text-anchor="middle" font-size="9" fill="#a03070">System-assigned · User-assigned</text>
  <text x="440" y="357" text-anchor="middle" font-size="9" fill="#a03070">No credential management</text>

  <!-- Access Reviews -->
  <rect x="570" y="300" width="170" height="70" rx="8" fill="#0c1a1a" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="655" y="325" text-anchor="middle" font-size="12" fill="#22d3ee" font-weight="bold">Access Reviews</text>
  <text x="655" y="343" text-anchor="middle" font-size="9" fill="#1090a0">Quarterly guest review</text>
  <text x="655" y="357" text-anchor="middle" font-size="9" fill="#1090a0">Monthly admin role review</text>

  <!-- External Identities / B2B -->
  <rect x="340" y="400" width="200" height="70" rx="8" fill="#1a1500" stroke="#eab308" stroke-width="1.5"/>
  <text x="440" y="425" text-anchor="middle" font-size="12" fill="#facc15" font-weight="bold">External Identities</text>
  <text x="440" y="443" text-anchor="middle" font-size="9" fill="#a08000">B2B Guests: 320 partner users</text>
  <text x="440" y="457" text-anchor="middle" font-size="9" fill="#a08000">Domains: fabrikam.com, contoso.com</text>

  <!-- App Registrations -->
  <rect x="570" y="400" width="170" height="70" rx="8" fill="#0c0c1a" stroke="#6366f1" stroke-width="1.5"/>
  <text x="655" y="425" text-anchor="middle" font-size="12" fill="#818cf8" font-weight="bold">App Registrations</text>
  <text x="655" y="443" text-anchor="middle" font-size="9" fill="#5060b0">Service Principals: 42</text>
  <text x="655" y="457" text-anchor="middle" font-size="9" fill="#5060b0">Client credentials · Cert auth</text>

  <!-- Connectors between Entra and features -->
  <line x1="440" y1="170" x2="440" y2="200" stroke="#0078d4" stroke-width="1" marker-end="url(#arrow-blue)"/>
  <line x1="540" y1="130" x2="570" y2="130" stroke="#0078d4" stroke-width="1" marker-end="url(#arrow-blue)"/>
  <line x1="440" y1="270" x2="440" y2="300" stroke="#0078d4" stroke-width="1" marker-end="url(#arrow-blue)"/>
  <line x1="655" y1="270" x2="655" y2="300" stroke="#0078d4" stroke-width="1" marker-end="url(#arrow-blue)"/>
  <line x1="440" y1="370" x2="440" y2="400" stroke="#0078d4" stroke-width="1" marker-end="url(#arrow-blue)"/>
  <line x1="655" y1="370" x2="655" y2="400" stroke="#0078d4" stroke-width="1" marker-end="url(#arrow-blue)"/>

  <!-- Legend -->
  <rect x="330" y="490" width="540" height="20" rx="4" fill="#111827"/>
  <text x="340" y="504" font-size="9" fill="#4a6fa5">■ On-Prem</text>
  <text x="415" y="504" font-size="9" fill="#0078d4">■ Entra ID Core</text>
  <text x="510" y="504" font-size="9" fill="#8b5cf6">■ PIM</text>
  <text x="555" y="504" font-size="9" fill="#f59e0b">■ Conditional Access</text>
  <text x="680" y="504" font-size="9" fill="#22c55e">■ Admin Units</text>
  <text x="775" y="504" font-size="9" fill="#ec4899">■ Managed ID</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#0078d4"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3db46d"/>
    </marker>
  </defs>
</svg>
